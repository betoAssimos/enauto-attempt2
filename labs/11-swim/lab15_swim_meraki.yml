---
- name: Meraki SWIM lab
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
  # Retrieving from environment variables
    api_key: "{{ lookup('env', 'MERAKI_API_KEY') }}"
  # Upgrade stays disabled, the sandbox does not allow a real firmware upgrade
    apply_upgrade: false
    target_version_id: "REPLACE_WITH_AVAILABLE_VERSION_ID"
  # Future UTC time, format 2026-11-20T03:00:00Z
    upgrade_time: "REPLACE_WITH_FUTURE_UTC_TIME"

  tasks:
  - name: Get organizations
    cisco.meraki.organizations_info:
      meraki_api_key: "{{api_key}}"
    register: org_result

  - name: Reservation must have only one organization
    ansible.builtin.assert:
      that:
        - org_result.meraki_response | length == 1

  - name: Get networks
    cisco.meraki.networks_info:
      meraki_api_key: "{{api_key}}"
      organizationId: "{{ org_result.meraki_response[0].id }}"
    register: network_result

  - name: Reservation must have only one network
    ansible.builtin.assert:
      that:
        - network_result.meraki_response | length == 1

  - name: Save organization and network IDs
    ansible.builtin.set_fact:
      org_id: "{{ org_result.meraki_response[0].id }}"
      network_id: "{{ network_result.meraki_response[0].id }}"

  - name: Get firmware information
    cisco.meraki.networks_firmware_upgrades_info:
      meraki_api_key: "{{api_key}}"
      networkId: "{{network_id}}"
    register: firmware_result

  - name: Get devices
    cisco.meraki.devices_info:
      meraki_api_key: "{{api_key}}"
      organizationId: "{{org_id}}"
      networkIds:
        - "{{network_id}}"
    register: devices_result

  - name: Get device availability
    cisco.meraki.organizations_devices_availabilities_info:
      meraki_api_key: "{{api_key}}"
      organizationId: "{{org_id}}"
      networkIds:
        - "{{network_id}}"
    register: availability_result

  - name: Display devices
    ansible.builtin.debug:
      var: devices_result.meraki_response

  - name: Display availability
    ansible.builtin.debug:
      var: availability_result.meraki_response

  # Firmware is per product type inside "products". Only switch is used here.
  - name: Save switch firmware information
    ansible.builtin.set_fact:
      switch_firmware: "{{ firmware_result.meraki_response.products.switch }}"

  - name: Display current version
    ansible.builtin.debug:
      var: switch_firmware.currentVersion

  - name: Display available versions
    ansible.builtin.debug:
      var: switch_firmware.availableVersions

  - name: Display next scheduled upgrade
    ansible.builtin.debug:
      var: switch_firmware.nextUpgrade

  # NOT TESTED. Everything below only runs with apply_upgrade: true
  - name: Schedule firmware upgrade
    when: apply_upgrade | bool
    block:
    - name: Target version must be available and different from current
      ansible.builtin.assert:
        that:
          - target_version_id in (switch_firmware.availableVersions | map(attribute='id') | list)
          - target_version_id != switch_firmware.currentVersion.id

    - name: Schedule the upgrade
      cisco.meraki.networks_firmware_upgrades:
        meraki_api_key: "{{api_key}}"
        state: present
        networkId: "{{network_id}}"
        products:
          switch:
            nextUpgrade:
              time: "{{upgrade_time}}"
              toVersion:
                id: "{{target_version_id}}"
      register: schedule_result

    - name: Get firmware information again
      cisco.meraki.networks_firmware_upgrades_info:
        meraki_api_key: "{{api_key}}"
        networkId: "{{network_id}}"
      register: firmware_after

    # This only proves the schedule was stored, not that devices upgraded
    - name: Scheduled version must be the target version
      ansible.builtin.assert:
        that:
          - firmware_after.meraki_response.products.switch.nextUpgrade.toVersion.id == target_version_id

    - name: Display stored schedule
      ansible.builtin.debug:
        var: firmware_after.meraki_response.products.switch.nextUpgrade