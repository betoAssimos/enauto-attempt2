---
- name: SD-WAN SWIM lab
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  # Retrieving from environment variables
    sdwan_login:
      url: "{{ lookup('env', 'SDWAN_HOST') }}"
      username: "{{ lookup('env', 'SDWAN_USERNAME') }}"
      password: "{{ lookup('env', 'SDWAN_PASSWORD') }}"
  # Upgrade stays disabled, there is no compatible image for this reservation
    apply_upgrade: false
    image_path: "REPLACE_WITH_LOCAL_IMAGE_FILE"
    target_version: "REPLACE_WITH_REPOSITORY_VERSION"
    make_default: false

  tasks:
  - name: Get Edge1
    cisco.catalystwan.devices_info:
      manager_credentials: "{{sdwan_login}}"
      device_category: vedges
      filters:
        host_name: "Edge1"
    register: device_result

  - name: Must find only one device
    ansible.builtin.assert:
      that:
        - device_result.devices | length == 1

  - name: Save Edge1
    ansible.builtin.set_fact:
      edge: "{{ device_result.devices[0] }}"

  - name: Get software repository
    cisco.catalystwan.software_repository_info:
      manager_credentials: "{{sdwan_login}}"
      category: software_images
    register: repository_result

  - name: Get software installed on Edge1
    cisco.catalystwan.software_upgrade_info:
      manager_credentials: "{{sdwan_login}}"
      device_type: vedge
      filters:
        host_name: "Edge1"
    register: software_result

  - name: Display Edge1 version and reachability
    ansible.builtin.debug:
      msg: "{{ edge.host_name }} | {{ edge.version }} | {{ edge.reachability }}"

  - name: Display repository
    ansible.builtin.debug:
      var: repository_result.software_images

  - name: Display installed software
    ansible.builtin.debug:
      var: software_result.installed_devices

  # NOT TESTED. Everything below only runs with apply_upgrade: true
  # Order: upload -> install -> activate -> verify -> set default
  - name: Upgrade Edge1
    when: apply_upgrade | bool
    block:
    - name: Edge1 must be reachable and on a different version
      ansible.builtin.assert:
        that:
          - edge.reachability == 'reachable'
          - edge.version != target_version

    - name: Upload image to the Manager repository
      cisco.catalystwan.software_repository:
        manager_credentials: "{{sdwan_login}}"
        software:
          state: present
          image_path: "{{image_path}}"

    - name: Get software repository again
      cisco.catalystwan.software_repository_info:
        manager_credentials: "{{sdwan_login}}"
        category: software_images
      register: repository_after

    - name: Target version must be in the repository
      ansible.builtin.assert:
        that:
          - target_version in (repository_after.software_images | map(attribute='version_name') | list)

    # state present = install only, the device keeps running the old version
    - name: Install image
      cisco.catalystwan.software_upgrade:
        manager_credentials: "{{sdwan_login}}"
        state: present
        image_version: "{{target_version}}"
        devices:
          - "{{ edge.uuid }}"
        reboot: false
        sync: true
        wait_for_completed: true
        wait_timeout_seconds: 1800

    # state active = change partition, the device reboots
    - name: Activate image
      cisco.catalystwan.software_upgrade:
        manager_credentials: "{{sdwan_login}}"
        state: active
        image_version: "{{target_version}}"
        devices:
          - "{{ edge.uuid }}"
        wait_for_completed: true
        wait_timeout_seconds: 1800

    - name: Wait for Edge1 to come back on the target version
      cisco.catalystwan.devices_info:
        manager_credentials: "{{sdwan_login}}"
        device_category: vedges
        filters:
          host_name: "Edge1"
      register: post_result
      until: post_result.devices[0].reachability == 'reachable' and post_result.devices[0].version == target_version
      retries: 60
      delay: 10

    - name: Display version before and after
      ansible.builtin.debug:
        msg: "{{ edge.host_name }} | before {{ edge.version }} | after {{ post_result.devices[0].version }}"

    - name: Set target version as default
      cisco.catalystwan.software_upgrade:
        manager_credentials: "{{sdwan_login}}"
        state: default
        image_version: "{{target_version}}"
        devices:
          - "{{ edge.uuid }}"
        wait_for_completed: true
        wait_timeout_seconds: 1800
      when: make_default | bool