---
- name: Discover SD-WAN software and optionally upgrade Edge1
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

    manager_credentials:
      url: "{{ lookup('ansible.builtin.env', 'SDWAN_HOST') }}"
      username: "{{ lookup('ansible.builtin.env', 'SDWAN_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'SDWAN_PASSWORD') }}"

    target_hostname: Edge1
    apply_upgrade: false
    image_path: ""
    target_version: ""
    make_default: false

  module_defaults:
    cisco.catalystwan.devices_info:
      manager_credentials: "{{ manager_credentials }}"
    cisco.catalystwan.software_repository_info:
      manager_credentials: "{{ manager_credentials }}"
    cisco.catalystwan.software_upgrade_info:
      manager_credentials: "{{ manager_credentials }}"
    cisco.catalystwan.software_repository:
      manager_credentials: "{{ manager_credentials }}"
    cisco.catalystwan.software_upgrade:
      manager_credentials: "{{ manager_credentials }}"

  tasks:
    - name: Read the selected edge device
      cisco.catalystwan.devices_info:
        device_category: vedges
        filters:
          host_name: "{{ target_hostname }}"
      register: device_result

    - name: Require exactly one matching edge
      ansible.builtin.assert:
        that:
          - device_result.devices | length == 1
        fail_msg: Expected exactly one matching edge device.

    - name: Store the selected device
      ansible.builtin.set_fact:
        selected_device: "{{ device_result.devices[0] }}"

    - name: Read the software repository
      cisco.catalystwan.software_repository_info:
        category: software_images
      register: repository_result

    - name: Read software upgrade information for the edge
      cisco.catalystwan.software_upgrade_info:
        device_type: vedge
        filters:
          host_name: "{{ target_hostname }}"
      register: software_result

    - name: Show discovery results
      ansible.builtin.debug:
        msg:
          device: "{{ selected_device }}"
          repository: "{{ repository_result.software_images }}"
          software: "{{ software_result.installed_devices }}"

    - name: Optional software upgrade
      when: apply_upgrade | bool
      block:
        - name: Check the target version and device reachability
          ansible.builtin.assert:
            that:
              - target_version | length > 0
              - target_version != selected_device.version
              - selected_device.reachability == 'reachable'
            fail_msg: Set a different target version and select a reachable edge.

        - name: Upload a local software image when supplied
          cisco.catalystwan.software_repository:
            software:
              state: present
              image_path: "{{ image_path }}"
          when: image_path | length > 0

        - name: Refresh repository information
          cisco.catalystwan.software_repository_info:
            category: software_images
          register: repository_after_upload

        - name: Select the target version from the local repository
          ansible.builtin.set_fact:
            matching_images: >-
              {{
                repository_after_upload.software_images
                | selectattr('version_name', 'equalto', target_version)
                | selectattr('version_type', 'equalto', 'vmanage')
                | list
              }}

        - name: Require exactly one matching repository image
          ansible.builtin.assert:
            that:
              - matching_images | length == 1
            fail_msg: The target version must exist in the Manager repository.

        - name: Install the image without activating it
          cisco.catalystwan.software_upgrade:
            state: present
            image_version: "{{ target_version }}"
            devices:
              - "{{ selected_device.uuid }}"
            reboot: false
            sync: true
            wait_for_completed: true
            wait_timeout_seconds: 1800

        - name: Read installed versions after installation
          cisco.catalystwan.software_upgrade_info:
            device_type: vedge
            filters:
              host_name: "{{ target_hostname }}"
          register: installed_result

        - name: Require one matching software inventory record
          ansible.builtin.assert:
            that:
              - installed_result.installed_devices | length == 1

        - name: Confirm the target version is installed
          ansible.builtin.assert:
            that:
              - target_version in (installed_result.installed_devices[0].available_versions | default([], true))
            fail_msg: The target version was not listed after installation.

        - name: Activate the installed image
          cisco.catalystwan.software_upgrade:
            state: active
            image_version: "{{ target_version }}"
            devices:
              - "{{ selected_device.uuid }}"
            wait_for_completed: true
            wait_timeout_seconds: 1800

        - name: Wait for the edge to return with the target version
          cisco.catalystwan.devices_info:
            device_category: vedges
            filters:
              uuid: "{{ selected_device.uuid }}"
          register: post_upgrade_result
          until: >-
            (post_upgrade_result.devices | default([]) | length == 1)
            and (post_upgrade_result.devices[0].reachability == 'reachable')
            and (post_upgrade_result.devices[0].version == target_version)
          retries: 60
          delay: 10

        - name: Show the verified device version
          ansible.builtin.debug:
            msg:
              hostname: "{{ target_hostname }}"
              original_version: "{{ selected_device.version }}"
              reported_version: "{{ post_upgrade_result.devices[0].version }}"
              reachability: "{{ post_upgrade_result.devices[0].reachability }}"

        - name: Optionally make the target version the default
          when: make_default | bool
          block:
            - name: Set the default software version
              cisco.catalystwan.software_upgrade:
                state: default
                image_version: "{{ target_version }}"
                devices:
                  - "{{ selected_device.uuid }}"
                wait_for_completed: true
                wait_timeout_seconds: 1800

            - name: Read back the default version
              cisco.catalystwan.software_upgrade_info:
                device_type: vedge
                filters:
                  host_name: "{{ target_hostname }}"
              register: default_result

            - name: Require one matching default-version record
              ansible.builtin.assert:
                that:
                  - default_result.installed_devices | length == 1

            - name: Verify the default version
              ansible.builtin.assert:
                that:
                  - default_result.installed_devices[0].default_version == target_version
                fail_msg: The device did not report the target version as default.

    - name: Report read-only execution
      ansible.builtin.debug:
        msg: Discovery finished. Upgrade operations are disabled.
      when: not (apply_upgrade | bool)