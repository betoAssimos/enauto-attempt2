name: enauto

mgmt:
  network: enauto-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  defaults:
    kind: cisco_c8000v
    image: vrnetlab/cisco_c8000v:17.15.04c
    labels:
      role: automation-target
      platform: iosxe

  nodes:
    iosxe-01:
      mgmt-ipv4: 172.30.30.11

    iosxe-02:
      mgmt-ipv4: 172.30.30.12

    iosxe-03:
      mgmt-ipv4: 172.30.30.13
